service: votacion-serverless

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 128
  timeout: 10

functions:
  auditoriaVotaciones:
    handler: index.handler
    events:
      - http:
          path: /serverless/auditoria
          method: post
      - schedule: rate(1 hour)
